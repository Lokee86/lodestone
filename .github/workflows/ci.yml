name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .standards/docs_policy/check.py --repo .

  linux-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: cargo build -p lodestone-ffi --release --locked
      - name: Test Go binding against Lodestone
        env:
          LODESTONE_LIBRARY: ${{ github.workspace }}/target/release/liblodestone_ffi.so
        working-directory: bindings/go
        run: go test ./... -count=1

  windows-binding:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: cargo build -p lodestone-ffi --release --locked
      - name: Test Go binding against Lodestone
        shell: pwsh
        run: |
          $env:LODESTONE_LIBRARY = "$pwd\target\release\lodestone_ffi.dll"
          Set-Location bindings/go
          go test ./... -count=1
